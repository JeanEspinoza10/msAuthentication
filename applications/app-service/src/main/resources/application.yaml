server:
  port: 7551
spring:
  application:
    name: "msAuthentication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  postgresql:
    host: "localhost"
    port: 5433
    database: "msAuthentication"
    schema: "public"
    username: "srpingAuth"
    password: 123456
  sql:
    init:
      mode: "always"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:7551"
logging:
  level:
    root: INFO
    co.com.bancolombia: DEBUG   # tu paquete en debug
  file:
    name: logs/app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"